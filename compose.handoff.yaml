services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: logistics_dwh
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DWH_CORE_PORT:?Set DWH_CORE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
  spatial-db:
    profiles: ["spatial-research"]
    image: postgis/postgis:17-3.6@sha256:1ac10b2551ba84ae05db8e7da477afcd0a3fede99bcb7705da2ee157390cb095
    environment:
      POSTGRES_DB: spatial_research
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DWH_SPATIAL_PORT:?Set DWH_SPATIAL_PORT}:5432"
    volumes:
      - spatial_research_data:/var/lib/postgresql/data
volumes:
  postgres_data:
  spatial_research_data:
